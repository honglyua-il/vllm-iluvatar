# Qwen/Qwen3.8-27B runtime quant（file 模式）
# 开源权重：https://modelscope.cn/models/Qwen/Qwen3.8-27B
#
# 同样需要 --quantization ilu_runtime。
#
# file 必须是所有 worker 可见的绝对路径。部署前：
#   1. 把同目录 fp8-runtime.json 放到目标机器
#   2. sha256sum fp8-runtime.json，把结果写成 sha256:<64 位小写 hex>
#   3. 填写下面的 file 与 sha256
# 修改 JSON 后必须重新计算 sha256。
additional-config:
  ilu_quant:
    source: file
    file: /path/to/vllm-iluvatar/examples/iluvatar-runtime-quant/Qwen/Qwen3.8-27B/fp8-runtime.json
    sha256: sha256:a2fb0c31cd86482039e165c2a77b419747e0852ef0b1ee6475e3a1a52c3982b8
