# Qwen/Qwen3.8-Flash-Next runtime quant
# 开源权重：https://modelscope.cn/models/Qwen/Qwen3.8-Flash-Next
# 本地 FP8 checkpoint 可能带 -FP8 后缀；--model 指向实际路径，本文件只描述 ilu_quant。
additional-config:
  ilu_quant:
    source: inline
    schema_version: 1
    enabled: true
    applies_to:
      model_types: [qwen4_exp_text]
      quant_methods: [fp8]
    ignore: []
    config_groups:
      qwen38_dense_bf16_to_fp8:
        priority: 100
        targets:
          - 're:.*\.self_attn\.qkv_proj$'
          - 're:.*\.self_attn\.o_proj$'
          - 're:.*\.self_attn\.indexer\.index_qk_proj$'
          - 're:.*\.linear_attn\.(?:in_proj_qkvz|in_proj_ba|out_proj)$'
          - 're:.*\.mlp\.shared_expert\.(?:gate_up_proj|down_proj)$'
          - 're:.*\.ple\.(?:key_proj|value_proj)$'
        require:
          original_disposition: ignored
          checkpoint_dtypes: [bfloat16]
        weights:
          source:
            format: native
            dtypes: [bfloat16]
          target:
            format: fp8
            dtype: float8_e4m3fn
            strategy: channel
          loading:
            mode: transform
            stage: process_weights_after_loading
        input_activations:
          num_bits: 8
          type: float
          strategy: token
          dynamic: true
        output_activations: null
        iluvatar:
          method: IluFp8PerChannelOnlineLinearMethod
          gemm_format: TN
          shape_mismatch_policy: fallback_original
        validation:
          expected_selected: 242
          expected_transformed: 158
          expected_fallback: 84
