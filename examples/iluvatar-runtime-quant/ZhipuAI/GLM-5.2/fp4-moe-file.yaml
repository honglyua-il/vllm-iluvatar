# ZhipuAI/GLM-5.2-FP8 routed experts: block-FP8 -> ix30 FP4（file 模式）
#
# 内容与 fp4-moe-inline.yaml 等价，只是把 config_groups 放到同目录的
# fp4-moe-runtime.json。checkpoint 自带 quantization_config，不要传 --quantization。
#
# file 必须是所有 worker 可见的绝对路径。部署前：
#   1. 把同目录 fp4-moe-runtime.json 放到目标机器
#   2. sha256sum fp4-moe-runtime.json，把结果写成 sha256:<64 位小写 hex>
#   3. 填写下面的 file 与 sha256
# 修改 JSON 后必须重新计算 sha256。
additional-config:
  ilu_quant:
    source: file
    file: /path/to/vllm-iluvatar/examples/iluvatar-runtime-quant/ZhipuAI/GLM-5.2/fp4-moe-runtime.json
    sha256: sha256:a4f7ce2ad406dfa4c170d192e53eeb140ee45847eb0f32b1593523fd3072d8b7
