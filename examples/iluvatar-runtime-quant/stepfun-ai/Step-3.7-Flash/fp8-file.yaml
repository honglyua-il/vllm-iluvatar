# stepfun-ai/Step-3.7-Flash runtime quant（file 模式）
# 开源权重：https://modelscope.cn/models/stepfun-ai/Step-3.7-Flash
#
# file 必须是所有 worker 可见的绝对路径。部署前：
#   1. 把同目录 fp8-runtime.json 放到目标机器
#   2. sha256sum fp8-runtime.json，把结果写成 sha256:<64 位小写 hex>
#   3. 填写下面的 file 与 sha256
# 修改 JSON 后必须重新计算 sha256。
additional-config:
  ilu_quant:
    source: file
    file: /path/to/vllm-iluvatar/examples/iluvatar-runtime-quant/stepfun-ai/Step-3.7-Flash/fp8-runtime.json
    sha256: sha256:a45ed2419aa1f71c843a886bb4270731a9d7227e0d38d6eaf6a000437d7f8473
